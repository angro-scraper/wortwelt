workflows:
  ios-app-store:
    name: WortWelt iOS App Store package
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Existing Codemagic secure integration; this workflow alone consumes it.
      app_store_connect: Sacuvaj Hranu App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.wortwelt.app
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install locked JavaScript dependencies
        script: npm ci
      - name: Verify learning flows
        script: |
          npm test -- --reporter=dot
          npm run typecheck
      - name: Sync Capacitor wrappers
        script: npm run cap:sync
      - name: Install iOS dependencies
        script: |
          cd ios/App
          pod install
      - name: Apply App Store signing profile
        script: xcode-project use-profiles
      - name: Build iOS package
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      # xcode-project build-ipa exports relative to the repository root.
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
